[project]
name = "sms"
version = "0.1.0"
description = "Smart Marking System: agent-based marking, review and feedback on student scripts"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "anthropic>=0.40",
    "atomic-agents>=2.10.0,<3.0.0",
    "cryptography>=43",
    "instructor>=1.14.5,<2.0.0",
    "openai>=1.99.0",
    "pillow>=10",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
]

[project.scripts]
sms = "sms.cli:main"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sms"]
include = ["src/sms/migrations/**"]
