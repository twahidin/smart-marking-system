[project]
name = "sms"
version = "0.1.0"
description = "Smart Marking System: agent-based marking, review and feedback on student scripts"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "anthropic>=0.40",
    "atomic-agents>=2.10.0,<3.0.0",
    "cryptography>=43",
    "fastapi>=0.115",
    "httpx>=0.27",
    "instructor>=1.14.5,<2.0.0",
    "itsdangerous>=2.2",
    "openai>=1.99.0",
    "openpyxl>=3.1.5",
    "pillow>=10",
    "pillow-heif>=0.18",
    "psycopg[binary]>=3.2,<4",
    "pymupdf>=1.24",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.9",
    "reportlab>=4.2",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
sms = "sms.cli:main"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:builtin type Swig.*has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated.*:DeprecationWarning",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sms"]
include = ["src/sms/migrations/**"]
